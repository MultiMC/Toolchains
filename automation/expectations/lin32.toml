# What a lin32 build must look like; checked by compat-check.py (see its --help).
# Generated on 2026-10-25 from the shipped mmc-develop-lin32.tar.gz (snapshots/2026-10-21-deth001), then edited by hand:
# change it together with the Launcher change that needs it, and say why.

[files]
list = [
    "MultiMC",
    "bin/MultiMC",
    "bin/jars/JavaCheck.jar",
    "bin/jars/NewLaunch.jar",
    "bin/libLauncher_iconfix.so",
    "bin/libLauncher_nbt++.so",
    "bin/libLauncher_quazip.so",
    "bin/libLauncher_rainbow.so",
]

[elf]
machine = 3  # i386
system_libs = [
    "libQt5Core.so.5",
    "libQt5Gui.so.5",
    "libQt5Network.so.5",
    "libQt5Svg.so.5",
    "libQt5Widgets.so.5",
    "libQt5Xml.so.5",
    "libc.so.6",
    "libgcc_s.so.1",
    "libm.so.6",
    "libstdc++.so.6",
    "libz.so.1",
]
max_versions = { "CXXABI_" = "CXXABI_1.3", "GCC_" = "GCC_3.0", "GLIBCXX_" = "GLIBCXX_3.4.21", "GLIBC_" = "GLIBC_2.4" }

[urls]
main_binary = "bin/MultiMC"
# ${NAME} is the setting NAME (UPDATER_BASE, NOTIFICATION_URL, TRANSLATIONS_BASE_URL)
required = [
    "${NOTIFICATION_URL}",
    "${TRANSLATIONS_BASE_URL}",
    # ${TRANSLATIONS_BASE_URL}index_v2.json: not embedded any more since the Launcher builds it
    # from TRANSLATIONS_BASE_URL (Launcher_TRANSLATIONS_BASE_URL, branch translations-url, 2026-10-25)
    "${UPDATER_BASE}",
    "http://api.technicpack.net/modpack/",
