[macho]
archs = [
    "X86_64",
]
max_minimum_macos = "10.13"
link_prefixes = ["@", "/usr/lib/", "/System/"]

[urls]
main_binary = "Contents/MacOS/MultiMC"
# ${NAME} is the setting NAME (UPDATER_BASE, NOTIFICATION_URL, TRANSLATIONS_BASE_URL)
required = [
    "${NOTIFICATION_URL}",
    "${TRANSLATIONS_BASE_URL}",
